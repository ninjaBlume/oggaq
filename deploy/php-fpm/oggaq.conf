; /etc/php/8.4/fpm/pool.d/oggaq.conf — varsayılan www havuzunu kaldırıp bunu kullanın.
[oggaq]
user = oggaq
group = oggaq
listen = /run/php/oggaq.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
; Küçük/orta sunucu için başlangıç değerleri; RAM'e göre ayarlayın (her işçi ~40-80 MB).
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; İstek başına 30 sn üst sınır (nginx fastcgi_read_timeout ile uyumlu).
request_terminate_timeout = 35s
catch_workers_output = yes
clear_env = yes
env[PATH] = /usr/local/bin:/usr/bin:/bin

php_admin_value[expose_php] = Off
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 2M
php_admin_value[session.cookie_secure] = 1
; Dağıtım sembolik bağ değiştirir: kod değişince php-fpm yeniden yüklenir (deploy.sh), bu yüzden zaman damgası denetimi kapalı.
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[realpath_cache_size] = 4096K
php_admin_value[realpath_cache_ttl] = 600
