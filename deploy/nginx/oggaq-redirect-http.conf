# YALNIZ SEÇENEK B (açık 80/443): HTTP -> HTTPS yönlendirmesi. Seçenek A'da (Tunnel) 80 portu hiç dinlenmez.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com app.example.com admin.example.com;
    # Let's Encrypt kullanılacaksa doğrulama konumu açık kalır.
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
