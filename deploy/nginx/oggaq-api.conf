# api.example.com: Laravel API (PHP-FPM). /etc/nginx/sites-available/oggaq-api.conf olarak kurulur.
# Yer tutucular: api.example.com, app.example.com, admin.example.com, /srv/oggaq, sertifika yolları.

server {
    # Giriş yolu: snippets/ingress.conf, ingress-tunnel.conf (A: Cloudflare Tunnel, yalnız 127.0.0.1:8080) ya da
    # ingress-public.conf (B: 443 + Cloudflare Origin CA) dosyasına sembolik bağdır (docs/DEPLOYMENT.md).
    # İki seçenekte de gerçek istemci adresi CF-Connecting-IP başlığından alınır.
    include snippets/ingress.conf;
    server_name api.example.com;

    root /srv/oggaq/current/backend/public;
    index index.php;
    charset utf-8;

    # API gövdeleri küçüktür (JSON). Dışa aktarma yalnızca yanıttır.
    client_max_body_size 1m;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    server_tokens off;

    include snippets/security-headers.conf;
    # JSON API: hiçbir kaynak yüklemez, çerçeveye alınamaz.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Gizli dosyalar (.env, .git ...) asla sunulmaz; yalnızca .well-known açık.
    location ~ /\.(?!well-known) { deny all; return 404; }

    location / { try_files $uri /index.php?$query_string; }

    # Horizon paneli (yalnızca doğrulanmış platform yöneticisi). Ek önlem olarak yönetici adresine kısıtlayın:
    # location ^~ /horizon { allow 203.0.113.10; deny all; try_files $uri /index.php?$query_string; }
    # location ^~ /vendor/horizon { allow 203.0.113.10; deny all; try_files $uri =404; }
    # Not: panel kendi sayfalarında satır içi betik kullanır; bu yüzden yukarıdaki CSP başlığı panel konumlarında
    # tekrarlanmaz (yalnızca bu iki konumda add_header bildirmek üst düzey add_header'ları kapatır).

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/oggaq.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # TLS bu nginx'te bitiyor: Laravel https'i böyle anlar (güvenilen vekil ayarı gerekmez).
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 30s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 16 16k;
    }
    # Başka hiçbir .php dosyası çalıştırılmaz.
    location ~ \.php$ { return 404; }

    access_log /var/log/nginx/oggaq-api.access.log;
    error_log  /var/log/nginx/oggaq-api.error.log warn;
}
