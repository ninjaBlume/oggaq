# SEÇENEK B — Cloudflare proxy'li DNS + Cloudflare Origin CA sertifikası (SSL modu "Full (strict)"): nginx 443'te
# dışarıya açıktır. Güvenlik duvarında 80/443 yalnızca Cloudflare aralıklarına izin verin (docs/DEPLOYMENT.md).
# Üç ana makine adını tek joker sertifika (*.example.com) karşılar. Cloudflare KULLANMAYAN Let's Encrypt kurulumunda
# her sunucu bloğu için ayrı sertifika yolu yazın ve cloudflare-realip.conf dosyasını HİÇ dahil etmeyin.
listen 443 ssl;
listen [::]:443 ssl;

ssl_certificate     /etc/ssl/oggaq/origin.pem;
ssl_certificate_key /etc/ssl/oggaq/origin.key;
include snippets/tls.conf;

# Cloudflare aralıkları update-cloudflare-ips.sh ile üretilir (gerçek istemci adresi CF-Connecting-IP).
include snippets/cloudflare-realip.conf;
