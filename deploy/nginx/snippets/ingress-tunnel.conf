# SEÇENEK A — Cloudflare Tunnel: nginx YALNIZCA 127.0.0.1'de dinler, TLS'i Cloudflare uçta bitirir, cloudflared
# bağlantıyı sunucudan DIŞARIYA doğru kurar. Güvenlik duvarında 80/443 gelen trafik açılmaz.
# Üç sunucu bloğu da aynı porta düşer; hangisi olduğu Host başlığından (cloudflared varsayılanı: genel ana makine adı) anlaşılır.
listen 127.0.0.1:8080;

# Buraya yalnız cloudflared (aynı makine) ulaşabildiği için CF-Connecting-IP'ye güvenmek güvenlidir.
# Laravel'in ayrıca TRUSTED_PROXIES ayarına gerek kalmaz: PHP-FPM'e gerçek adres REMOTE_ADDR olarak iletilir.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
