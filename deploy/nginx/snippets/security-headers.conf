# Tüm sunucu blokları için ortak başlıklar. HSTS'yi HTTPS çalıştığı doğrulandıktan sonra açın ve süreyi kademeli artırın.
add_header X-Content-Type-Options "nosniff" always;
# Sanctum aynı origin GET isteklerini tanıyabilsin; yol ve sorgudaki token'lar Referer'a girmez.
add_header Referrer-Policy "strict-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
