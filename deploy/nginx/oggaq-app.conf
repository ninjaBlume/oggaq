# app.example.com: öğrenci web uygulaması (statik React derlemesi). /etc/nginx/sites-available/oggaq-app.conf
# Derleme, deploy.sh tarafından VITE_API_URL=https://api.example.com ile /srv/oggaq/current/apps/web/dist altına üretilir.

server {
    # Giriş yolu: snippets/ingress.conf, ingress-tunnel.conf (A: Cloudflare Tunnel, yalnız 127.0.0.1:8080) ya da
    # ingress-public.conf (B: 443 + Cloudflare Origin CA) dosyasına sembolik bağdır (docs/DEPLOYMENT.md).
    # İki seçenekte de gerçek istemci adresi CF-Connecting-IP başlığından alınır.
    include snippets/ingress.conf;
    server_name app.example.com;

    root /srv/oggaq/current/apps/web/dist;
    index index.html;
    server_tokens off;

    include snippets/security-headers.conf;
    # Betikler yalnızca kendi kaynağımızdan (tema betiği de ayrı dosyadır); API adresi connect-src'ye yazılır.
    # React satır içi style nitelikleri kullandığı için style-src 'unsafe-inline' gerekir.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.example.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite çıktısı içerik özetli ad taşır: bir yıl önbellek, değişmez.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include snippets/security-headers.conf;
        try_files $uri =404;
    }
    # Giriş sayfası ve tema betiği her açılışta doğrulanır (yeni sürüm hemen görünsün).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.example.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    }
    location = /theme-init.js {
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
    }
    # Herkese açık yasal sayfalar (gizlilik, koşullar, destek, hesap silme): statik HTML, JavaScript gerektirmez. Mağaza
    # incelemecileri ve tarayıcılar bunları giriş yapmadan açar; her istekte doğrulanır, bilinmeyen yol SPA'ya düşmez (404).
    location /legal/ {
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
        try_files $uri =404;
    }
    location ~ /\.(?!well-known) { deny all; return 404; }
    # SPA: bilinmeyen yollar uygulamaya düşer (istemci yönlendirmesi).
    location / { try_files $uri /index.html; }

    access_log /var/log/nginx/oggaq-app.access.log;
    error_log  /var/log/nginx/oggaq-app.error.log warn;
}
