name: oggaq-development

x-app: &app
  image: oggaq-development-app:${OGGAQ_RELEASE:-local}
  build:
    context: ../..
    dockerfile: deploy/server-development/Dockerfile
    target: php-base
  env_file: ${OGGAQ_ENV_FILE:-.env}
  volumes:
    - storage:/var/www/backend/storage
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  init: true
  mem_limit: 1g
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  app:
    <<: *app

  worker:
    <<: *app
    command: [php, artisan, horizon]
    stop_grace_period: 90s

  scheduler:
    <<: *app
    command: [php, artisan, schedule:work]

  web:
    image: oggaq-development-web:${OGGAQ_RELEASE:-local}
    build:
      context: ../..
      dockerfile: deploy/server-development/Dockerfile
      target: web
      args:
        APP_URL: ${APP_URL:?APP_URL gerekli}
    ports:
      - '127.0.0.1:${OGGAQ_HTTP_PORT:-18080}:8080'
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    secrets:
      - postgres_password
    volumes:
      - database:/var/lib/postgresql
      - ./init-database.sh:/docker-entrypoint-initdb.d/10-oggaq.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres && psql -U postgres -d oggaq -Atqc "select 1" | grep -qx 1']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 2g

  redis:
    image: redis:8-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD gerekli}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:${OGGAQ_MAIL_PORT:-18025}:8025'
    restart: unless-stopped
    mem_limit: 256m

volumes:
  database:
  redis:
  storage:

secrets:
  postgres_password:
    file: ${OGGAQ_POSTGRES_PASSWORD_FILE:-.postgres-password}

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.88.0/24
