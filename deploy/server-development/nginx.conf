server {
    listen 8080;
    server_name oggsorubankasi.codentum.net;
    server_tokens off;
    root /var/www/web;
    index index.html;
    client_max_body_size 1m;
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Yalnızca önündeki, aynı Compose ağındaki Cloudflare Tunnel bu başlığı sağlar.
    # Ağda başka projeler yer almaz; 8080 dışarıya yalnızca loopback üzerinden bağlıdır.
    set_real_ip_from 172.30.88.0/24;
    real_ip_header CF-Connecting-IP;

    location = /yonetim { return 308 /yonetim/; }
    location /yonetim/ {
        alias /var/www/admin/;
        try_files $uri $uri/ /yonetim/index.html;
    }
    location /api/ { try_files /__backend_missing__ @backend; }
    location /sanctum/ { try_files /__backend_missing__ @backend; }
    location = /up { try_files /__backend_missing__ @backend; }
    location @backend {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
    }
    # Bilinmeyen dosya yollarına SPA HTML'i dönmez.
    location ~ /\. { return 404; }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
    access_log off;
    error_log /var/log/nginx/error.log warn;
}
