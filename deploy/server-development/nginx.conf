# Keep HTML byte-identical through the proxy: no injected analytics/rewritten notices.
# Assets retain their normal caching; API JSON does not receive this header.
map $sent_http_content_type $oggsor_html_cache_control {
    default "";
    ~^text/html "no-cache, no-transform";
}

# Only the public landing page on the current brand domains is indexable.
# request_uri survives the internal /index.html redirect and includes query strings.
map "$host:$request_uri" $oggsor_robots_tag {
    default "noindex, nofollow";
    ~^(www\.)?oggsor\.com:/(\?.*)?$ "index, follow";
}

server {
    listen 8080;
    server_name oggsor.com www.oggsor.com oggsorubankasi.codentum.net;
    server_tokens off;
    root /var/www/site;
    index index.html;
    client_max_body_size 1m;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control $oggsor_html_cache_control always;
    # Applies only to this hostname, without includeSubDomains or preload.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag $oggsor_robots_tag always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # Yalnızca önündeki, aynı Compose ağındaki Cloudflare Tunnel bu başlığı sağlar.
    # Ağda başka projeler yer almaz; 8080 dışarıya yalnızca loopback üzerinden bağlıdır.
    set_real_ip_from 172.30.88.0/24;
    real_ip_header CF-Connecting-IP;

    # Cloudflare ziyaretçinin protokolünü bu başlıkta iletir; tünelin yerel HTTP bağlantısı yönlendirme döngüsü yaratmaz.
    if ($http_x_forwarded_proto = http) {
        return 308 https://oggsor.com$request_uri;
    }

    # Public download website and the account links used by the mobile app.
    # Student study screens are not served by the public website.
    location = /theme-init.js {
        root /var/www/web;
        try_files $uri =404;
    }
    location /assets/ {
        root /var/www/web;
        try_files $uri =404;
    }
    location ~ ^/(account|account-deleted|reset-password|verify-email|confirm-email-change)/?$ {
        root /var/www/web;
        try_files /index.html =404;
    }
    location = /study { return 302 /; }
    location /study/ { return 302 /; }

    location = /yonetim { return 308 /yonetim/; }
    location /yonetim/ {
        alias /var/www/admin/;
        try_files $uri $uri/ /yonetim/index.html;
    }
    location /api/ { try_files /__backend_missing__ @backend; }
    location /sanctum/ { try_files /__backend_missing__ @backend; }
    location = /up { try_files /__backend_missing__ @backend; }
    location @backend {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
    }
    # Bilinmeyen dosya yollarına SPA HTML'i dönmez.
    location ~ /\. { return 404; }
    location ~ \.php$ { return 404; }
    location / { try_files $uri $uri/ =404; }
    access_log off;
    error_log /var/log/nginx/error.log warn;
}
