name: Uygulamalar ve API

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: oggaq_test
          POSTGRES_USER: oggaq
          POSTGRES_PASSWORD: ci-only-synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oggaq -d oggaq_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: oggaq_test
      DB_USERNAME: oggaq
      DB_PASSWORD: ci-only-synthetic-password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, mbstring, pcntl, posix
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Test ortamı ve geçici anahtar
        run: |
          cp backend/.env.example backend/.env.testing
          cp backend/.env.example backend/.env
          php -r '$key = "base64:".base64_encode(random_bytes(32)); echo "::add-mask::".$key.PHP_EOL; file_put_contents(getenv("GITHUB_ENV"), "APP_KEY=".$key.PHP_EOL, FILE_APPEND);'
      - name: Kilitli PHP bağımlılıkları
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: PHP manifest ve güvenlik kontrolü
        working-directory: backend
        run: |
          composer validate --strict
          composer check-platform-reqs
          composer audit
          composer lint
      - name: PostgreSQL ve Redis testleri
        working-directory: backend
        run: composer test
      - name: API sözleşmesi
        run: |
          npm ci --ignore-scripts
          npm run lint:api
          npm run generate:api
          git diff --exit-code -- packages/shared-types/src/api.d.ts
      - name: Web uygulamaları tip, test ve derleme
        run: |
          npm run typecheck
          npm run test:admin
          npm run build:admin
          npm run test:web
          npm run build:web
          npm run test:mobile
          npm run test:core
          npm run audit
          npx expo-doctor apps/mobile
          npm run export:mobile:preview
      - name: Gerçek API ile Chromium akışları
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_LOCAL_PREVIEW: "1"
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm ci --ignore-scripts
      - name: Yerel önizleme native yapılandırması
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Metro paketi gömülü Android önizleme APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: oggaq-android-local-preview
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_LOCAL_PREVIEW: "1"
      EXPO_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: iOS önizleme yapılandırması ve CocoaPods
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: İmza gerektirmeyen iOS Simulator derlemesi
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace oggaqnizleme.xcworkspace -scheme oggaqnizleme -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tee build.log
        shell: bash -eo pipefail {0}
      - name: Simulator uygulamasını paketle
        working-directory: apps/mobile/ios
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release-iphonesimulator/oggaqnizleme.app oggaq-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: oggaq-ios-simulator
          path: apps/mobile/ios/oggaq-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
